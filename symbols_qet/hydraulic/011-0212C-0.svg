<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60.0" height="40.0" viewBox="-20.0 -20.0 60.0 40.0" data-name="Three-way valve">
  <title>Three-way valve</title>
  <g stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10.00" y1="0.00" x2="10.00" y2="10.00" stroke="black" fill="none" />
    <polygon points="5,0 15,0 10,-10" stroke="black" fill="none" />
    <line x1="-10.00" y1="-10.00" x2="0.00" y2="-10.00" stroke="black" fill="none" />
    <line x1="20.00" y1="-10.00" x2="30.00" y2="-10.00" stroke="black" fill="none" />
    <polygon points="20,-4 10,-10 20,-16" stroke="black" fill="none" />
    <polygon points="0,-16 0,-4 10,-10" stroke="black" fill="none" />
    <circle class="qet-terminal" cx="-10.00" cy="-10.00" r="1.8" fill="red" stroke="none" data-name="" data-orientation="w" />
    <circle class="qet-terminal" cx="10.00" cy="10.00" r="1.8" fill="red" stroke="none" data-name="" data-orientation="s" />
    <circle class="qet-terminal" cx="30.00" cy="-10.00" r="1.8" fill="red" stroke="none" data-name="" data-orientation="e" />
  </g>
</svg>
