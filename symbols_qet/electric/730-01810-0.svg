<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="50.0" height="70.0" viewBox="-25.0 -65.0 50.0 70.0" data-name="Watt-hour meter, counting the energy flow towards the busbars">
  <title>Watt-hour meter, counting the energy flow towards the busbars</title>
  <g stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-20.00" y="-40.00" width="40.00" height="40.00" stroke="black" fill="none" />
    <text x="-8.00" y="-16.00" font-size="9.0" font-family="sans-serif" fill="black" stroke="none">Wh</text>
    <rect x="-20.00" y="-60.00" width="40.00" height="20.00" stroke="black" fill="none" />
    <line x1="-15.00" y1="-50.00" x2="15.00" y2="-50.00" stroke="black" fill="none" />
    <line x1="-16.00" y1="-52.00" x2="-16.00" y2="-48.00" stroke="black" fill="none" />
    <polygon points="4,-48 4,-52 -4,-50" stroke="black" fill="black" />
  </g>
</svg>
