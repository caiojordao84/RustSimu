<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="30.0" height="30.0" viewBox="-15.0 -15.0 30.0 30.0" data-name="Semiconductor effect">
  <title>Semiconductor effect</title>
  <g stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10.00" y1="-10.00" x2="2.00" y2="-5.00" stroke="black" fill="none" />
    <line x1="-10.00" y1="0.00" x2="2.00" y2="0.00" stroke="black" fill="none" />
    <line x1="2.00" y1="-10.00" x2="2.00" y2="10.00" stroke="black" fill="none" />
    <line x1="10.00" y1="10.00" x2="2.00" y2="5.00" stroke="black" fill="none" />
  </g>
</svg>
