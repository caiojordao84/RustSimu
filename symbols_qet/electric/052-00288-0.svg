<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40.0" height="60.0" viewBox="-12.0 -30.0 40.0 60.0" data-name="Vertical wattmeter">
  <title>Vertical wattmeter</title>
  <g stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="7.5,7.5 15,10 20,10" stroke="black" fill="none" />
    <polyline points="7.5,-7.5 15,-10 20,-10" stroke="black" fill="none" />
    <polyline points="-5,-6 -2.5,6 0,0 2.5,6 5,-6" stroke="black" fill="none" />
    <line x1="0.00" y1="10.00" x2="0.00" y2="20.00" stroke="black" fill="none" />
    <line x1="0.00" y1="-20.00" x2="0.00" y2="-10.00" stroke="black" fill="none" />
    <ellipse cx="0.00" cy="0.00" rx="10.00" ry="10.00" stroke="black" fill="none" />
    <circle class="qet-terminal" cx="20.00" cy="10.00" r="1.8" fill="red" stroke="none" data-name="V2" data-orientation="e" />
    <circle class="qet-terminal" cx="0.00" cy="20.00" r="1.8" fill="red" stroke="none" data-name="I_out" data-orientation="s" />
    <circle class="qet-terminal" cx="20.00" cy="-10.00" r="1.8" fill="red" stroke="none" data-name="V1" data-orientation="e" />
    <circle class="qet-terminal" cx="0.00" cy="-20.00" r="1.8" fill="red" stroke="none" data-name="I_in" data-orientation="n" />
  </g>
</svg>
