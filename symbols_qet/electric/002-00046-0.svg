<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40.0" height="30.0" viewBox="-20.0 -12.0 40.0 30.0" data-name="Four-wire connector">
  <title>Four-wire connector</title>
  <g stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-10,0 -5,0 0,5 5,0 10,0" stroke="black" fill="none" />
    <line x1="0.00" y1="-5.00" x2="0.00" y2="10.00" stroke="black" fill="none" />
    <circle class="qet-terminal" cx="10.00" cy="0.00" r="1.8" fill="red" stroke="none" data-name="2" data-orientation="e" />
    <circle class="qet-terminal" cx="0.00" cy="-5.00" r="1.8" fill="red" stroke="none" data-name="1" data-orientation="n" />
    <circle class="qet-terminal" cx="-10.00" cy="0.00" r="1.8" fill="red" stroke="none" data-name="4" data-orientation="w" />
    <circle class="qet-terminal" cx="0.00" cy="10.00" r="1.8" fill="red" stroke="none" data-name="3" data-orientation="s" />
  </g>
</svg>
