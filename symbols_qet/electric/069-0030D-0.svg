<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40.0" height="60.0" viewBox="-20.0 -30.0 40.0 60.0" data-name="Unipolar transistor MOSFET">
  <title>Unipolar transistor MOSFET</title>
  <g stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="10,0 6,-2 6,2" stroke="black" fill="black" />
    <line x1="2.00" y1="0.00" x2="-10.00" y2="0.00" stroke="black" fill="none" />
    <polyline points="4,-4 10,-4 10,-20" stroke="black" fill="none" />
    <polyline points="4,0 10,0 10,20" stroke="black" fill="none" />
    <line x1="4.00" y1="4.00" x2="10.00" y2="4.00" stroke="black" fill="none" />
    <line x1="4.00" y1="3.00" x2="4.00" y2="5.00" stroke="black" fill="none" />
    <line x1="4.00" y1="-1.00" x2="4.00" y2="1.00" stroke="black" fill="none" />
    <line x1="4.00" y1="-5.00" x2="4.00" y2="-3.00" stroke="black" fill="none" />
    <line x1="2.00" y1="-5.00" x2="2.00" y2="5.00" stroke="black" fill="none" />
    <circle class="qet-terminal" cx="10.00" cy="-20.00" r="1.8" fill="red" stroke="none" data-name="" data-orientation="n" />
    <circle class="qet-terminal" cx="10.00" cy="20.00" r="1.8" fill="red" stroke="none" data-name="" data-orientation="s" />
    <circle class="qet-terminal" cx="-10.00" cy="0.00" r="1.8" fill="red" stroke="none" data-name="" data-orientation="w" />
  </g>
</svg>
