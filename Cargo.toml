[package]
name = "cade-simu-rs"
version = "0.4.0"
edition = "2021"
default-run = "cade-simu-rs"
description = "Reescrita nativa em Rust (iced) do CADe_SIMU 4.0 — Editor CAD Eletrotécnico e Simulador de Comandos Elétricos"

[dependencies]
iced = { version = "0.13", features = ["canvas", "tokio", "svg"] }
rfd = "0.15"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
