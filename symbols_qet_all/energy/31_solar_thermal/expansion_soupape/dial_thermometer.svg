    <ellipse cx="0.00" cy="2.75" rx="10.00" ry="10.00" stroke="black" fill="none" />
    <polyline points="-1,12.75 -1,15.75 1,15.75 1,12.75" stroke="black" fill="none" />
    <text x="-3.00" y="10.00" font-size="9.0" font-family="sans-serif" fill="black" stroke="none">°C</text>
    <line x1="0.00" y1="15.75" x2="0.00" y2="16.75" stroke="black" fill="none" />
