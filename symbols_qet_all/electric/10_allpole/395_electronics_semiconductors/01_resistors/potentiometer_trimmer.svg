    <line x1="0.00" y1="20.00" x2="0.00" y2="-20.00" stroke="black" fill="none" />
    <rect x="-4.00" y="-10.00" width="8.00" height="20.00" stroke="black" fill="white" />
    <polyline points="-10,0 -4,0 4,4 6,4" stroke="black" fill="none" />
    <line x1="6.00" y1="6.00" x2="6.00" y2="2.00" stroke="black" fill="none" />
    <circle class="qet-terminal" cx="0.00" cy="20.00" r="1.8" fill="red" stroke="none" data-name="A2" data-orientation="s" />
    <circle class="qet-terminal" cx="-10.00" cy="0.00" r="1.8" fill="red" stroke="none" data-name="S" data-orientation="w" />
    <circle class="qet-terminal" cx="0.00" cy="-20.00" r="1.8" fill="red" stroke="none" data-name="A1" data-orientation="n" />
  </g>
